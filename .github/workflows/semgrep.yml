name: Semgrep

on:
  pull_request: {}
  push:
    branches: [main, working]
  workflow_dispatch: {}

permissions:
  actions: read            # upload-sarif reads the workflow run (needed in a private repository)
  contents: read
  security-events: write   # so findings can appear in the Security tab

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: semgrep.sarif
