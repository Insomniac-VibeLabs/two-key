name: coverage
on:
  push:
    branches: [main, PyPI, testpypi]
  pull_request:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/uv.txt
          uv sync --locked --no-build --extra yaml --extra mcp --no-dev --python python --no-managed-python --no-python-downloads
          uv pip install --python .venv --require-hashes --only-binary :all: -r .github/requirements/coverage.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: TypeScript helper coverage (LCOV)
        # Builds the helper's tests too, so the Python run below includes the cross-language tests.
        working-directory: typescript/toolcheck
        run: |
          npm ci --ignore-scripts
          npm run coverage
          sed -i 's#^SF:#SF:typescript/toolcheck/#' lcov.info
      - name: Run coverage and produce XML
        # xvfb-run gives the window tests (tests/test_ledger_gui.py, tests/test_constitution_gui.py) a display; Linux jobs without one skip them.
        run: |
          xvfb-run -a .venv/bin/coverage run -m unittest discover -s tests
          .venv/bin/coverage report -m
          .venv/bin/coverage xml -o coverage.xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0 (v6)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=insomniac-vibelabs
            -Dsonar.projectKey=Insomniac-VibeLabs_two-key
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.javascript.lcov.reportPaths=typescript/toolcheck/lcov.info
            -Dsonar.sources=two_key,typescript/toolcheck/src
            -Dsonar.tests=tests,typescript/toolcheck/test
