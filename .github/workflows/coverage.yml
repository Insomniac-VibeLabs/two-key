name: coverage
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --only-binary :all: "uv==0.13.0" "coverage==7.16.2"
          uv sync --locked --no-build --extra yaml --no-dev --python python --no-managed-python --no-python-downloads
          uv pip install --python .venv --only-binary :all: "coverage==7.16.2"
      - name: Run coverage
        run: |
          .venv/bin/coverage run -m unittest discover -s tests
          .venv/bin/coverage report -m
