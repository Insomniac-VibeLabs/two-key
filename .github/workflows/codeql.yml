name: codeql
on:
  push:
    branches: [main, working, "10.2.2026"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    # On all three platforms (maintainer, 2026-10-15). Semgrep stays on Linux: its container runs only there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          # One category per platform. The single-job configuration main ran before 0.6.0 is stale: until it is
          # deleted (Security, Code scanning, Tool status), a PR's CodeQL check warns "1 configuration not found".
          category: ${{ matrix.os == 'ubuntu-latest' && '/language:python' || format('/language:python/os:{0}', matrix.os) }}
