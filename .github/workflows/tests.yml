name: tests
on:
  push:
    branches: [main, PyPI, testpypi]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from uv.lock
        run: |
          pip install --only-binary :all: "uv==0.13.0"
          uv sync --locked --no-build --extra yaml --extra mcp --no-dev --python python --no-managed-python --no-python-downloads
      - name: Tests
        run: uv run --no-sync --no-build python -m unittest discover -s tests
      - name: Demo
        if: ${{ !cancelled() }}
        run: uv run --no-sync --no-build python -m two_key demo

  # Python 3.15 ahead of its release: Linux only, and not required. PyYAML publishes no cp315 wheel yet,
  # so it alone is built from source (the runner has a compiler); every other package stays wheels only, so a
  # second package without a wheel fails here instead of being built quietly. Make it required, and add macOS
  # and Windows, once PyYAML ships cp315 wheels (#27).
  test-3-15:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install from uv.lock, building PyYAML only
        run: |
          pip install --only-binary :all: "uv==0.13.0"
          export UV_NO_BUILD_PACKAGE="$(python -c 'import tomllib; print(" ".join(sorted({p["name"] for p in tomllib.load(open("uv.lock", "rb"))["package"]} - {"pyyaml", "two-key"})))')"
          uv sync --locked --extra yaml --extra mcp --no-dev --python python --no-managed-python --no-python-downloads
      - name: Tests
        run: uv run --no-sync --no-build python -m unittest discover -s tests
      - name: Demo
        if: ${{ !cancelled() }}
        run: uv run --no-sync --no-build python -m two_key demo
