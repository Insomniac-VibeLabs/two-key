# Path B judges: pick whichever AIs you want, local or vendor.
# No secrets go in this file. API keys are read from environment variables
# (or the OS keyring) at call time.
# Replace every REPLACE_WITH_MODEL with a model name your account can use.
# Replace REPLACE_WITH_BALLOT_KEY with that judge's own secret. The loader refuses the placeholder.
# The loader refuses both placeholders.
# receives_proposal: true sends that judge the proposal. Recommended: a different model than the monitored agent.
# A cloud judge is called in a new session and must not reuse the agent's credential.

quorum:
  required_yes: 2            # k-of-n: how many judges must say "consistent"
  min_responding: 2          # refuse to decide if fewer valid ballots arrive
  min_distinct_providers: 1  # 1 = not enforced (see DESIGN_OPTIONS.md section 2)
  timeout_seconds: 45        # judges run in parallel; any judge not done by then abstains
  # PRIOR_ART.md §4 (iii) options (defaults shown; QuorumPolicy.section4() in code
  # uses min_vendors: 2, min_local_judges: 1, require_path_a_first: true):
  # min_vendors: 1
  # min_local_judges: 0
  # heterogeneity_scope: selection   # selection | responding
  # judge_inputs: record_only        # record_only | record_and_proposal
  # ballot_binding: stamp            # stamp | echo (echo needs echo_binding: true on every judge)
  # require_path_a_first: false

judges:
  - id: grok
    type: openai_compatible          # OpenAI-compatible API (OpenAI, xAI, vLLM, llama.cpp, ...)
    provider: xai
    base_url: https://api.x.ai/v1
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: XAI_API_KEY}

  - id: claude
    type: anthropic
    provider: anthropic
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: ANTHROPIC_API_KEY}

  - id: gemini
    type: gemini
    provider: google
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: GEMINI_API_KEY}

  - id: local-llama
    type: ollama                     # local weights via Ollama, no key needed
    provider: local
    base_url: http://localhost:11434
    model: REPLACE_WITH_MODEL
    # local_weights: true            # the default for ollama; counts toward min_local_judges
    # weights_sha256: <hash of the weight file>   # optional, recorded in ballots

# Optional per-judge keys: vendor (defaults to provider), local_weights, weights_sha256, echo_binding.

# Other auth modes (interfaces; see two_key/judges/credentials.py):
#   auth: {type: keyring, service: two-key, username: openai}
#   auth: {type: username_password, username: me, password_env: MY_GATEWAY_PASSWORD,
#          login: "my_hooks:login"}                  # you supply the login hook
#   auth: {type: oauth_device_code, client_id: ..., device_authorization_endpoint: ...,
#          token_endpoint: ..., fetch_token: "my_hooks:device_flow"}   # stub unless hook given
#   auth: {type: callback, callback: "my_hooks:get_sso_token"}         # any SSO/OAuth token source
