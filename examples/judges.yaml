# Cloud OpenAI and xAI use a strict ballot schema by default (response_format: auto).
# A local OpenAI-compatible server stays on json_object. Set response_format: json_schema
# or json_object to force one. xAI defaults to reasoning_effort: low; set reasoning_effort to override.
# Anthropic caches the constitution, not the action record. No secrets in this file.
# Path B judges: pick whichever AIs you want, local or cloud.
# No secrets go in this file. API keys are read from environment variables
# (or the OS keyring) at startup, for the judge-is-not-the-agent check, and
# again at call time. A judge key that cannot be read refuses to start.
# Replace every REPLACE_WITH_MODEL with a model name your account can use.
# The local judge is already set to the recommended model, qwen2.5:7b
# (Qwen2.5-7B-Instruct). The weights are not in this repository.
# A ballot key, if used, is ballot_key_env: the name of an environment variable. Do not write the secret here.
# The loader refuses both placeholders.
# receives_proposal: true sends that judge the proposal.
# A judge that is not on a loopback host denies the round unless authorize is
# given the agent session (two-key authorize --agent-session-env NAME). A judge
# whose key equals that session abstains, wherever it connects
# (cloud_judge_reused_agent_session).

# Only the top-level keys judges, quorum, and monitored_agent are accepted,
# and a key repeated in one mapping is refused.

# The monitored agent, declared by you, never by the agent. Required. A
# judge may run any model from any vendor. A judge is not the monitored
# agent: at startup Two-Key refuses (judge_matches_agent:) when a judge holds
# the agent's credential (the same API token, or the same username and
# password) at any address, sent or not (a key identifies its holder), or
# when neither side sends a credential on one address (host:port as written
# here, no DNS). Likely
# accidents start with a warning on stderr, recorded in constitution_loaded:
# one side keyless on the agent's address, the agent's model on its address
# or through a shared or undeclared proxy (declare upstream:), a shared
# tenant id, or an unresolved upstream.
# This example agent is ChatGPT, which is not one of the judges below.
monitored_agent:
  id: chatgpt
  model: REPLACE_WITH_MODEL
  provider: openai                   # a label; recorded, never compared
  base_url: https://api.openai.com/v1
  credential_env: OPENAI_AGENT_API_KEY   # the env var name, not the key
  # username_env: AGENT_USER         # instead of credential_env: HTTP Basic, https only;
  # password_env: AGENT_PASSWORD     #   the pair is fingerprinted together
  # credential: none                 # instead, only for a keyless loopback/private agent
  # tenant: {organization: org-123}  # optional mapping: organization, project, account, deployment; also on a judge
  # upstream: api.openai.com         # optional, for a local proxy: where it routes (attested, recorded, not verified)
  # tenant and upstream only change which warnings print; they never let the same agent start.

quorum:
  required_yes: 2            # k-of-n: how many judges must say "consistent"
  min_responding: 2          # refuse to decide if fewer valid ballots arrive
  min_distinct_providers: 1  # 1 = this provider count is not itself a floor
  timeout_seconds: 45        # required hard deadline; judges run in parallel; any judge not done by then abstains (null is refused)
  # The default needs one judge and has no diversity floors:
  # min_makers 1, min_local_judges 0, require_local_yes false.
  # profile: high_assurance  # opt-in: min_makers 2, min_local_judges 1, require_local_yes true.
  #                          # Recommended for destructive, irreversible, financial, or external-send tools.
  #                          # This file's judges (four makers, one local Ollama judge) meet it.
  # A judge's maker is who made its model, as you label it (maker:, default: provider). It is not
  # verified, and it is not compared with the monitored agent. The old names min_vendors and
  # vendor: (through 0.2.2) are refused as unknown keys.
  # require_local_yes: true needs at least one local judge, or Two-Key does not start.
  # allow_same_provider_judge: deprecated and ignored; the same provider is allowed by default
  # QuorumPolicy.section4() is high_assurance plus require_path_a_first. TwoKey.authorize
  # still runs both paths; it does not read that flag.
  # heterogeneity_scope: selection   # selection | responding
  # judge_inputs: record_only        # record_only | record_and_proposal
  # ballot_binding: stamp            # stamp | echo (echo needs echo_binding: true on every judge)
  # require_path_a_first: false
  # tool_args_on_derive_deny: false
  # Set true to send argument bytes to judges after a derive deny.
  # The default withholds those bytes. Path B still runs either way.

judges:
  - id: grok
    type: openai_compatible          # OpenAI-compatible API (OpenAI, xAI, vLLM, llama.cpp, ...)
    provider: xai
    base_url: https://api.x.ai/v1
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: XAI_API_KEY}

  - id: claude
    type: anthropic
    provider: anthropic
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: ANTHROPIC_API_KEY}

  - id: gemini
    type: gemini
    provider: google
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: GEMINI_API_KEY}

  # Recommended local judge. Weights are not in this repo.
  # Qwen2.5-7B-Instruct, Apache-2.0, Copyright 2024 Alibaba Cloud.
  # https://huggingface.co/Qwen/Qwen2.5-7B-Instruct
  # Setup: docs/HOWTO.md#recommended-local-judge-qwen25-7b-instruct
  - id: local-qwen
    type: ollama                     # Ollama on this machine, no key needed
    provider: local
    maker: alibaba                   # who made the model; provider (local) is who serves it
    base_url: http://localhost:11434
    model: qwen2.5:7b
    # local_weights defaults to true only for a loopback or private base_url host. A judge is local
    # (counts toward min_local_judges) only if the flag is true AND the host is loopback or private.
    # weights_sha256: <hash of the GGUF>   # optional, recorded in ballots, not verified

# Optional per-judge keys: maker (defaults to provider; compared case-insensitively), local_weights,
# weights_sha256, echo_binding, tenant (a mapping, as above), upstream (for a local proxy).
# Judge ids must be unique.

# Other working auth modes:
#   auth: {type: keyring, service: two-key, username: openai}
#   auth: {type: callback, callback: "my_hooks:get_token"}
#   auth: {type: basic, username_env: JUDGE_USER, password_env: JUDGE_PASSWORD}   # https only
# OAuth device-code is rejected on this line.
