# The rules Path A checks for the Two-Key demo (docs/DEMO.md). Only pay_vendor is allowed, at most
# 100 US dollars, and only to acme or globex. The demo server's other tool, delete_all_records, is
# left out, so the agent never sees it.
serial: 1
hard_rules:
  - {id: tools, allow_only_tools: ["pay_vendor"]}
  - {id: cap, deny_if: {amount_usd_gt: 100}}
tool_specs:
  pay_vendor:
    irreversible: true
    data_class_floor: "financial"
    amount: {"json_path": "amount", "unit": "usd"}
    counterparties: [{"json_path": "vendor", "allow": ["acme", "globex"]}]
    payload: [{"json_path": "memo", "shape": "string", "max_length": 200}]
