# Answers for `two-key setup` in the Two-Key demo (docs/DEMO.md).
route: proxy
judges:
  - type: openai_compatible
    id: lmstudio-judge
    model: qwen3-4b-instruct-2507       # the model's API id in LM Studio
    base_url: http://127.0.0.1:1234/v1  # LM Studio on Windows, through the SSH tunnel
    maker: alibaba
    upstream: localhost:1234
    local_weights: true
    response_format: json_schema        # LM Studio's server documents only this JSON format
    timeout: 150                        # a small model on a CPU is slow
monitored_agent:
  id: demo-agent
  model: llama3.2:3b
  provider: ollama
  base_url: http://127.0.0.1:11434
  credential: none
rules_file: rules.yaml
prose_file: constitution.md
upstream:
  command: ["/opt/node24/bin/node",
            "/opt/notes-mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js",
            "/srv/notes"]
