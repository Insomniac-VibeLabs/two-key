# Hard rules and the per-tool specs that fill Path A's form from argument bytes.
# A tool in the allow list must have a spec. The spec is signed with the rules.
hard_rules:
  - id: tool-allowlist
    allow_only_tools: [search, calendar, email_draft, email_send, pay_bill, summarize]
  - id: no-wires
    deny_if: {tool: wire_transfer}
  - id: no-sensitive-data
    deny_if: {data_class_in: [medical, classified]}
  - id: spend-cap
    deny_if: {amount_usd_gt: 200}
  - id: irreversible-cap
    deny_if_irreversible_over: 200
  - id: blocked-parties
    deny_counterparties: [offshore-mule.example, acme-scam.example]

# JSON paths only. This file does not classify free text.
# A key the spec does not name does not reach the tool. deny_unmapped
# defaults off. Set it true to deny an unnamed key instead of dropping it.
# payload names a value that may be present and is not interpreted.
# With no shape, that path covers the value and its children.
# shape is string, number, or list (a list of strings). max_length bounds
# a string or a list. Shape does not classify the contents.
# A counterparty path lists the only values it may copy (allow). The tool
# receives the canonical value, not the raw spelling.
# pay_bill.amount.currency_path must be the string usd or the call is denied.
tool_specs:
  search:
    irreversible: false
    data_class_floor: public
  calendar:
    irreversible: false
    data_class_floor: personal
  email_draft:
    irreversible: false
    data_class_floor: public
    counterparties:
      - json_path: to
        allow: [ada@example]
    payload:
      - json_path: subject
        shape: string
        max_length: 200
      - json_path: body
        shape: string
        max_length: 8000
  email_send:
    irreversible: true
    data_class_floor: personal
    counterparties:
      - json_path: to
        allow: [ada@example]
    payload:
      - json_path: subject
        shape: string
        max_length: 200
      - json_path: body
        shape: string
        max_length: 8000
  pay_bill:
    irreversible: true
    data_class_floor: financial
    amount:
      json_path: amount
      unit: usd
      currency_path: currency
    counterparties:
      - json_path: to
        allow: [power-co.example]
  summarize:
    irreversible: false
    data_class_floor: public
