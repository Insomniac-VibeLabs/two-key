# Optional profile. Two-Key does not require Aeacus.
# Use this only if you want this local judge to be a required yes.
# AEACUS_TOKEN is Aeacus's own server secret. ballot_key_env names that variable.
# Do not write the secret in this file.
quorum:
  required_yes: 2
  min_responding: 2
  min_vendors: 1
  min_local_judges: 1
  require_local_yes: true
  judge_inputs: record_and_proposal
  ballot_binding: echo
  require_path_a_first: true  # Path A runs first; Path B still must answer
judges:
  - id: aeacus
    type: openai_compatible
    provider: aeacus-local
    base_url: http://127.0.0.1:8765/v1
    model: aeacus-micro-v1
    auth: {type: env, var: AEACUS_TOKEN}
    local_weights: true
    echo_binding: true
    allow_insecure_http: true
    ballot_key_env: AEACUS_TOKEN
    receives_proposal: true
