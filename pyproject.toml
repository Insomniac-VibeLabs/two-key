[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-key"
version = "0.2.0.dev0"
description = "Dual-path constitutional enforcement for AI agents (prototype, not production crypto)"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
# No license is declared here on purpose: licensing is the maintainers' decision.

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
keyring = ["keyring>=24"]
# ML-DSA-65 (FIPS 204) for the hybrid post-quantum suites; tested with 50.0.1 (bundled OpenSSL 4.0.2).
pq = ["cryptography>=50"]
# Alternative PQ backend (not FIPS-validated; refused in fips_mode). Not exercised against real liboqs.
liboqs = ["liboqs-python"]

[project.scripts]
two-key = "two_key.cli:main"

[tool.setuptools]
packages = ["two_key", "two_key.judges", "two_key.crypto"]

[tool.setuptools.package-data]
two_key = ["data/*.txt", "data/*.md"]
